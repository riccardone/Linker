name: Build, Test, and Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # nuget.org trusted publishing exchanges the job's OIDC token for a short-lived API key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Linker.App.sln

      - name: Build solution
        run: dotnet build src/Linker.App.sln -c Release --no-restore

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Pack NuGet packages
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          dotnet pack src/Linker.Core/Linker.Core.csproj -c Release --no-build --output ./nupkgs/linker /p:PackageVersion=$VERSION

      - name: Show packaged files
        run: ls -lhR ./nupkgs

      # Trusted publishing: matches the nuget.org policy for riccardone/Linker, workflow release.yml.
      # The API key it returns is valid for one hour, so it is requested right before the push.
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: riccardone  # nuget.org profile name, not an email address

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        # A loop, not find -exec: find ignores the exit code of what it runs, which hid every
        # rejected push. The step's shell stops at the first failing command.
        run: |
          shopt -s globstar nullglob
          packages=(./nupkgs/**/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then echo "::error::No packages to push"; exit 1; fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          shopt -s globstar nullglob
          packages=(./nupkgs/**/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then echo "::error::No packages to push"; exit 1; fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$GITHUB_TOKEN" \
              --source "https://nuget.pkg.github.com/${OWNER}/index.json" \
              --skip-duplicate
          done

      - name: Publish for Linux (linux-x64)
        run: dotnet publish src/Linker/Linker.csproj -c Release -r linux-x64 --self-contained true -o out-linux

      - name: Publish for Windows (win-x64)
        run: dotnet publish src/Linker/Linker.csproj -c Release -r win-x64 --self-contained true -o out-win

      - name: Publish for macOS ARM (osx-arm64)
        run: dotnet publish src/Linker/Linker.csproj -c Release -r osx-arm64 --self-contained true -o out-macos

      - name: Archive Linux build
        run: zip -r linker-linux-x64.zip out-linux

      - name: Archive Windows build
        run: zip -r linker-win-x64.zip out-win

      - name: Archive macOS build
        run: zip -r linker-osx-arm64.zip out-macos

      # ⬇️ Docker Build & Push
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/linker
          docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest -f src/Linker/Dockerfile .
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest

      - name: Generate release notes
        id: changelog
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          # The tag being released points at HEAD, so look for the previous tag from HEAD's parent.
          # With no earlier tag, list the whole history.
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          RANGE=${PREVIOUS_TAG:+$PREVIOUS_TAG..}HEAD
          {
            echo "changelog<<EOF"
            echo "### Changelog"
            echo ""
            git log --pretty=format:"- \`%s\` ([%h](${REPO_URL}/commit/%H))" "$RANGE"
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            linker-linux-x64.zip
            linker-win-x64.zip
            linker-osx-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
